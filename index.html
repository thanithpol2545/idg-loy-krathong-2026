<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>IDG Loy Krathong 2026 🏮 สไลด์กระทงลอยน้ำ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ===== Reset & Base ===== */
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        html, body {
            width:100%; height:100%;
            overflow:hidden;
            font-family:'Kanit',sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ===== Canvas Scene ===== */
        #scene {
            position: fixed; inset:0;
            background: linear-gradient(180deg,
                #020111 0%, #08032b 18%, #0d1a45 36%,
                #163255 50%, #154673 60%, #10598b 72%,
                #09659e 85%, #054e7d 100%);
            cursor: default;
            touch-action: none;
        }
        canvas { display: block; width:100%; height:100%; }

        /* ===== Top Header ===== */
        #top-header {
            position: fixed; top:0; left:0; right:0;
            display: flex; justify-content: space-between; align-items: flex-start;
            padding: 16px 20px;
            pointer-events: none;
            z-index: 20;
            gap: 10px;
            flex-wrap: wrap;
        }
        .header-title {
            text-align: left;
        }
        .header-title h1 {
            font-size: clamp(1.2rem, 3.6vw, 2.3rem);
            font-weight: 900;
            background: linear-gradient(135deg, #ffe066 0%, #ffaa00 50%, #ffd700 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 16px rgba(255,215,0,0.45));
            line-height: 1.2;
        }
        .header-title p {
            font-size: clamp(0.72rem, 1.5vw, 0.92rem);
            color: #ffe8aa;
            opacity: 0.85;
            letter-spacing: 0.5px;
        }

        .header-actions {
            display: flex; gap: 8px; align-items: center;
            pointer-events: auto;
            flex-wrap: wrap;
        }
        .stat-pill {
            background: rgba(10, 5, 35, 0.8);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 30px;
            padding: 6px 14px;
            color: #ffd700;
            font-size: 0.85rem;
            backdrop-filter: blur(10px);
            display: flex; align-items: center; gap: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .stat-pill strong { font-size: 1.15rem; color: #fff; }
        .action-btn {
            background: rgba(10, 5, 35, 0.8);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 30px;
            padding: 6px 14px;
            color: #ffeebb;
            font-size: 0.82rem;
            font-family: 'Kanit';
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.25s;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .action-btn:hover {
            border-color: #ffd700;
            background: rgba(255,215,0,0.2);
            transform: scale(1.05);
            color: #fff;
        }

        /* ===== Slide Control Bar at Bottom ===== */
        #bottom-dock {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            display: flex; flex-direction: column; align-items: center;
            padding: 10px 16px 20px;
            background: linear-gradient(180deg, transparent 0%, rgba(3, 12, 35, 0.88) 30%, rgba(2, 8, 25, 0.98) 100%);
            z-index: 30;
            pointer-events: auto;
        }

        #slide-hint {
            display: flex; align-items: center; gap: 8px;
            color: #ffe680;
            font-size: clamp(0.82rem, 2vw, 1.02rem);
            font-weight: 500;
            margin-bottom: 10px;
            text-shadow: 0 0 12px rgba(255,200,50,0.7);
            animation: bounceHint 2s infinite ease-in-out;
        }
        @keyframes bounceHint {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .dock-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            max-width: 680px; width: 100%;
            flex-wrap: wrap;
        }

        .krathong-types {
            display: flex; gap: 8px;
            background: rgba(15, 20, 50, 0.7);
            padding: 4px 8px;
            border-radius: 40px;
            border: 1px solid rgba(255,215,0,0.25);
            backdrop-filter: blur(12px);
        }
        .type-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 2px solid transparent;
            background: rgba(255,255,255,0.06);
            font-size: 1.4rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.25s;
        }
        .type-btn:hover, .type-btn.active {
            border-color: #ffd700;
            background: rgba(255,215,0,0.2);
            transform: scale(1.12);
            box-shadow: 0 0 16px rgba(255,200,50,0.5);
        }

        .wish-input-box {
            flex: 1;
            min-width: 220px;
            position: relative;
        }
        .wish-input-box input {
            width: 100%;
            height: 46px;
            background: rgba(10, 20, 55, 0.8);
            border: 1.5px solid rgba(255,215,0,0.35);
            border-radius: 30px;
            padding: 0 45px 0 16px;
            color: #fff;
            font-family: 'Kanit';
            font-size: 0.95rem;
            outline: none;
            backdrop-filter: blur(10px);
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        .wish-input-box input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 18px rgba(255,215,0,0.35);
        }
        .wish-input-box input::placeholder {
            color: rgba(255, 235, 180, 0.5);
            font-size: 0.88rem;
        }
        .anon-badge {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            font-size: 0.8rem; color: #ffca28; opacity: 0.75;
            pointer-events: none;
        }

        #drag-launcher {
            width: 62px; height: 62px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffe066 10%, #ff9800 80%, #e65100 100%);
            border: 2px solid #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: grab;
            box-shadow: 0 0 24px rgba(255,180,0,0.7), inset 0 0 10px rgba(255,255,255,0.6);
            touch-action: none;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        #drag-launcher:active { cursor: grabbing; transform: scale(1.15); }
        #drag-launcher .launcher-icon { font-size: 1.8rem; line-height: 1; pointer-events: none; }
        #drag-launcher .launcher-text {
            font-size: 0.62rem; font-weight: 700; color: #1a0800;
            pointer-events: none; margin-top: 1px;
        }
        .launcher-arrow {
            position: absolute; top: -16px;
            font-size: 0.9rem; color: #ffe680;
            animation: arrowUp 1.2s infinite ease-in-out;
            pointer-events: none;
        }
        @keyframes arrowUp {
            0%, 100% { transform: translateY(0); opacity: 0.6; }
            50% { transform: translateY(-5px); opacity: 1; }
        }

        #drag-avatar {
            position: fixed;
            width: 70px; height: 70px;
            display: none;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 20px rgba(255,215,0,0.8));
        }

        /* Detail Modal (Single Krathong) */
        #detail-modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(12, 10, 40, 0.94);
            border: 2px solid rgba(255,215,0,0.5);
            border-radius: 20px;
            padding: 24px 28px;
            z-index: 100;
            text-align: center;
            backdrop-filter: blur(20px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 380px; width: 90%;
            box-shadow: 0 0 50px rgba(255,200,50,0.3);
            pointer-events: auto;
        }
        #detail-modal.show { transform: translate(-50%, -50%) scale(1); }
        #detail-modal h3 { color: #ffd700; font-size: 1.3rem; margin-bottom: 8px; }
        #detail-modal .modal-wish {
            font-size: 1.1rem; color: #fff; margin: 16px 0;
            background: rgba(255,255,255,0.06); padding: 14px;
            border-radius: 12px; border: 1px dashed rgba(255,215,0,0.3);
            line-height: 1.6; word-break: break-word;
        }
        #detail-modal .modal-meta {
            font-size: 0.85rem; color: #ffe8aa; opacity: 0.8;
            margin-bottom: 18px;
        }
        #detail-modal button {
            padding: 8px 24px;
            background: linear-gradient(135deg, #ffd700, #ff9800);
            border: none; border-radius: 20px;
            font-family: 'Kanit'; font-weight: 600; cursor: pointer;
            color: #1a0800;
        }

        /* Wish History Drawer / Modal */
        #history-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            z-index: 150;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #history-modal.show {
            opacity: 1;
            pointer-events: auto;
        }
        .history-card {
            background: rgba(11, 14, 42, 0.96);
            border: 2px solid rgba(255, 215, 0, 0.4);
            border-radius: 24px;
            width: 100%;
            max-width: 620px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 60px rgba(0,0,0,0.6), 0 0 30px rgba(255,215,0,0.2);
            overflow: hidden;
            transform: scale(0.92);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #history-modal.show .history-card {
            transform: scale(1);
        }
        .history-header {
            padding: 20px 24px 16px;
            border-bottom: 1px solid rgba(255,215,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-header h2 {
            font-size: 1.3rem;
            color: #ffd700;
            display: flex; align-items: center; gap: 8px;
        }
        .close-btn {
            background: transparent;
            border: none;
            color: #ffe8aa;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .close-btn:hover { background: rgba(255,255,255,0.1); }
        .history-toolbar {
            padding: 12px 24px;
            background: rgba(255,255,255,0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .history-count {
            font-size: 0.9rem;
            color: #ffe680;
        }
        .export-btns {
            display: flex; gap: 8px;
        }
        .mini-btn {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.35);
            border-radius: 16px;
            padding: 4px 12px;
            color: #fff;
            font-family: 'Kanit';
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mini-btn:hover {
            background: rgba(255, 215, 0, 0.3);
            border-color: #ffd700;
        }
        .danger-btn {
            background: rgba(244, 67, 54, 0.15);
            border-color: rgba(244, 67, 54, 0.4);
            color: #ff8a80;
        }
        .danger-btn:hover {
            background: rgba(244, 67, 54, 0.35);
            border-color: #ff5252;
            color: #fff;
        }
        .history-list {
            padding: 16px 24px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .history-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            transition: border-color 0.2s, background 0.2s;
        }
        .history-item:hover {
            border-color: rgba(255, 215, 0, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }
        .item-icon {
            font-size: 1.8rem;
            line-height: 1;
            flex-shrink: 0;
            padding-top: 2px;
        }
        .item-body {
            flex: 1;
        }
        .item-wish {
            color: #fff;
            font-size: 0.95rem;
            margin-bottom: 6px;
            line-height: 1.5;
            word-break: break-word;
        }
        .item-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.8rem;
            color: #ffd700;
            opacity: 0.85;
        }
        .item-badge {
            background: rgba(255, 215, 0, 0.15);
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 0.72rem;
            color: #ffe680;
        }

        /* ===== Responsive Tuning ===== */
        @media (max-width: 600px) {
            .header-title h1 { font-size: 1.2rem; }
            .header-title p { display: none; }
            .header-actions { justify-content: flex-end; }
            .dock-controls { gap: 8px; }
            .wish-input-box { order: 1; width: 100%; min-width: 100%; }
            .krathong-types { order: 2; }
            #drag-launcher { order: 3; width: 52px; height: 52px; }
            #drag-launcher .launcher-icon { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div id="scene">
        <canvas id="canvas"></canvas>
    </div>

    <!-- Top Navigation & Stats -->
    <div id="top-header">
        <div class="header-title">
            <h1>🏮 IDG Loy Krathong 2026</h1>
            <p>กระทงสร้างสรรค์ เทพีแห่งนวัตกรรม</p>
        </div>
        <div class="header-actions">
            <div class="stat-pill" title="จำนวนกระทงที่ถูกลอยทั้งหมด">
                <span>🪷 ลอยแล้ว</span>
                <strong id="count-num">0</strong>
            </div>
            <button class="action-btn" id="open-history" title="เปิดดูคำอธิษฐานที่ถูกบันทึกทั้งหมด">
                📜 สมุดคำอธิษฐาน
            </button>
            <button class="action-btn" id="toggle-wishes" title="ซ่อน/แสดงคำอธิษฐานบนสายน้ำ">
                👁️ คำอธิษฐาน: <span id="wish-toggle-status">เปิด</span>
            </button>
        </div>
    </div>

    <!-- Bottom Dock with Slider & Input -->
    <div id="bottom-dock">
        <div id="slide-hint">
            <span>✨</span>
            <span id="hint-text">สไลด์กระทงขึ้นไปลอย หรือแตะผิวน้ำเพื่อปล่อยกระทง</span>
            <span>🌊</span>
        </div>

        <div class="dock-controls">
            <!-- Krathong Selector -->
            <div class="krathong-types">
                <button class="type-btn active" data-type="0" title="บัวหลวงชมพู">🪷</button>
                <button class="type-btn" data-type="1" title="ซากุระมงคล">🌸</button>
                <button class="type-btn" data-type="2" title="ชบาดอกแดง">🌺</button>
                <button class="type-btn" data-type="3" title="ใบตองรักษ์โลก">🍃</button>
            </div>

            <!-- Anonymous Wish Input Box -->
            <div class="wish-input-box">
                <input type="text" id="wish-input" placeholder="พิมพ์คำอธิษฐาน (ไม่ระบุชื่อ) ที่นี่..." maxlength="80">
                <span class="anon-badge">🔒 นิรนาม</span>
            </div>

            <!-- Drag to Slide Launcher -->
            <div id="drag-launcher" title="ลากสไลด์กระทงขึ้นไปปล่อยในน้ำ">
                <span class="launcher-arrow">▲</span>
                <span class="launcher-icon" id="launcher-icon">🪷</span>
                <span class="launcher-text">สไลด์ลอย</span>
            </div>
        </div>
    </div>

    <!-- Drag Avatar Follower -->
    <div id="drag-avatar">🪷</div>

    <!-- Single Krathong Detail Modal -->
    <div id="detail-modal">
        <h3>🪷 กระทงอธิษฐาน</h3>
        <div class="modal-wish" id="modal-wish-content">-</div>
        <div class="modal-meta" id="modal-meta-content">⏱️ ลอยเมื่อ - | นิรนาม</div>
        <button id="modal-close">ปิด</button>
    </div>

    <!-- Full Wish History & Data Management Modal -->
    <div id="history-modal">
        <div class="history-card">
            <div class="history-header">
                <h2>📜 สมุดบันทึกคำอธิษฐาน (บันทึกข้อมูลแล้ว)</h2>
                <button class="close-btn" id="close-history">✕</button>
            </div>
            <div class="history-toolbar">
                <span class="history-count" id="history-total">ทั้งหมด 0 ข้อความ</span>
                <div class="export-btns">
                    <button class="mini-btn" id="export-csv" title="ดาวน์โหลดเป็นไฟล์ CSV สำหรับ Excel">📥 ดาวน์โหลด CSV</button>
                    <button class="mini-btn" id="export-json" title="ดาวน์โหลดข้อมูลสำรอง JSON">📥 สำรอง JSON</button>
                    <button class="mini-btn danger-btn" id="clear-data" title="ล้างข้อมูลที่บันทึกไว้">🗑️ รีเซ็ต</button>
                </div>
            </div>
            <div class="history-list" id="history-list">
                <!-- Items populated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
    // ============================================================
    //  IDG Loy Krathong 2026 — Interactive Engine with Data Storage
    // ============================================================
    const STORAGE_KEY = 'idg_loy_krathong_data_2026';
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let W, H, waterY;
    let dpr = window.devicePixelRatio || 1;

    function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        dpr = window.devicePixelRatio || 1;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.scale(dpr, dpr);
        waterY = H * 0.52; // river surface starts at 52% of screen height
    }
    resize();
    window.addEventListener('resize', () => {
        resize();
        initStars();
        updateMoonPos();
    });

    // ---- Audio Chime & Ripple Sound Generator (Web Audio API) ----
    let audioCtx = null;
    function playSplashSound() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const now = audioCtx.currentTime;

            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, now); // D5
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5

            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.8);
        } catch(e) {}
    }

    // Helper: current formatted time (e.g. "09:30 น.")
    function getNowTimeString() {
        const d = new Date();
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        return `${hh}:${mm} น.`;
    }

    // Helper: full date and time string
    function getFullDateString(timestamp) {
        const d = timestamp ? new Date(timestamp) : new Date();
        const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
        const day = d.getDate();
        const month = months[d.getMonth()];
        const year = d.getFullYear() + 543;
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        return `${day} ${month} ${year} เวลา ${hh}:${mm} น.`;
    }

    // ---- State ----
    let krathongs = [];
    let savedDataList = [];
    let stars = [];
    let lanterns = [];
    let ripples = [];
    let sparkles = [];
    let fireflies = [];
    let selectedType = 0;
    let time = 0;
    let showWishes = true;
    const typeIcons = ['🪷', '🌸', '🌺', '🍃'];
    const typeNames = ['บัวหลวงชมพู', 'ซากุระมงคล', 'ชบาดอกแดง', 'ใบตองรักษ์โลก'];

    // Cross-Tab Synchronization (BroadcastChannel)
    let syncChannel = null;
    try {
        syncChannel = new BroadcastChannel('idg_loy_krathong_channel');
        syncChannel.onmessage = (e) => {
            if (e.data && e.data.type === 'NEW_KRATHONG') {
                const item = e.data.item;
                if (!krathongs.some(k => k.id === item.id)) {
                    instantiateKrathongFromData(item);
                    updateCounters();
                }
            }
        };
    } catch(err) {}

    // Storage event for other browser windows
    window.addEventListener('storage', (e) => {
        if (e.key === STORAGE_KEY) {
            loadPersistedData();
        }
    });

    // ---- Data Persistence Layer ----
    function loadPersistedData() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                savedDataList = JSON.parse(raw);
            } else {
                // Initialize default seeds
                savedDataList = [
                    { id: 'seed_1', wish: 'ขอให้ครอบครัวสุขภาพแข็งแรง มีความสุขตลอดไป', type: 0, timeStr: '09:12 น.', timestamp: Date.now() - 720000, xRatio: 0.22, yOffset: 45 },
                    { id: 'seed_2', wish: 'ขอให้โปรเจกต์ IDG สำเร็จราบรื่น นวัตกรรมปังๆ!', type: 1, timeStr: '09:18 น.', timestamp: Date.now() - 480000, xRatio: 0.44, yOffset: 75 },
                    { id: 'seed_3', wish: 'ขอขมาพระแม่คงคา และขอให้ชีวิตพบแต่ความสงบสุข', type: 2, timeStr: '09:22 น.', timestamp: Date.now() - 240000, xRatio: 0.66, yOffset: 40 },
                    { id: 'seed_4', wish: 'ขอให้ปีนี้มีแต่รอยยิ้ม สิ่งไม่ดีลอยไปกับสายน้ำ', type: 3, timeStr: '09:26 น.', timestamp: Date.now() - 60000, xRatio: 0.85, yOffset: 85 }
                ];
                saveToLocalStorage();
            }
        } catch(e) {
            savedDataList = [];
        }

        // Reconstruct floating krathongs in canvas
        krathongs = [];
        savedDataList.forEach(item => {
            instantiateKrathongFromData(item);
        });
        updateCounters();
    }

    function saveToLocalStorage() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(savedDataList));
        } catch(e) {}
    }

    function persistNewKrathong(item) {
        savedDataList.push(item);
        saveToLocalStorage();
        updateCounters();

        // Broadcast to other open tabs
        if (syncChannel) {
            syncChannel.postMessage({ type: 'NEW_KRATHONG', item: item });
        }
    }

    function instantiateKrathongFromData(item) {
        const xPos = item.xRatio ? (item.xRatio * W) : (W * 0.5);
        const yPos = waterY + (item.yOffset || (40 + Math.random() * 80));

        const k = {
            id: item.id,
            x: Math.max(40, Math.min(W - 40, xPos)),
            y: Math.max(yPos, waterY + 15),
            vx: (Math.random() - 0.45) * 0.28,
            vy: 0,
            size: 28 + (item.type % 2) * 3,
            type: item.type || 0,
            phase: Math.random() * Math.PI * 2,
            opacity: 1,
            wish: item.wish || 'ขอให้มีความสุข สมปรารถนาทุกประการ',
            timeStr: item.timeStr || getNowTimeString(),
            timestamp: item.timestamp || Date.now(),
            driftSpeed: 0.12 + Math.random() * 0.15
        };
        krathongs.push(k);
    }

    function updateCounters() {
        const total = savedDataList.length;
        document.getElementById('count-num').textContent = total;
        document.getElementById('history-total').textContent = `ทั้งหมด ${total} ข้อความ (บันทึกไว้ในเบราว์เซอร์)`;

    // Krathong Type Selector

    // ---- History Drawer / Modal Handlers ----

    // Export CSV
    document.getElementById('export-csv').addEventListener('click', () => {

    // ---- Stars ----
    function initStars() {
        stars = [];
        for (let i = 0; i < 180; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * (waterY * 0.88),
                r: Math.random() * 1.6 + 0.4,
                twinkle: Math.random() * Math.PI * 2,
                speed: Math.random() * 0.02 + 0.005
            });
        }
    }
    initStars();

    // ---- Moon ----
    const moon = { x: 0, y: 0, r: 40 };
    function updateMoonPos() {
        moon.x = W * 0.82;
        moon.y = H * 0.13;
        moon.r = Math.min(W, H) * 0.048;
    }
    updateMoonPos();

    // ---- Sky Lanterns ----
    function spawnLantern() {
        lanterns.push({
            x: Math.random() * W,
            y: waterY + Math.random() * 80,
            vx: (Math.random() - 0.28) * 0.35,
            vy: -(Math.random() * 0.45 + 0.25),
            size: Math.random() * 11 + 7,
            opacity: 0,
            maxOpacity: Math.random() * 0.5 + 0.4,
            life: 0,
            maxLife: Math.random() * 700 + 400
        });
    }
    for (let i = 0; i < 7; i++) spawnLantern();

    // ---- Fireflies ----
    function initFireflies() {
        fireflies = [];
        for (let i = 0; i < 22; i++) {
            fireflies.push({
                x: Math.random() * W,
                y: waterY - Math.random() * 160 - 20,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.3,
                r: Math.random() * 2 + 1,
                phase: Math.random() * Math.PI * 2
            });
        }
    }
    initFireflies();

    // ---- Sky & Background Drawing ----
    function drawMoon() {
        ctx.save();
        const g = ctx.createRadialGradient(moon.x, moon.y, moon.r * 0.4, moon.x, moon.y, moon.r * 4.5);
        g.addColorStop(0, 'rgba(255,250,210,0.22)');
        g.addColorStop(0.5, 'rgba(255,230,150,0.06)');
        g.addColorStop(1, 'rgba(255,230,150,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(moon.x, moon.y, moon.r * 4.5, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#fffde8';
        ctx.beginPath(); ctx.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = 'rgba(210,195,140,0.28)';
        ctx.beginPath(); ctx.arc(moon.x - moon.r*0.22, moon.y - moon.r*0.12, moon.r*0.24, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(moon.x + moon.r*0.28, moon.y + moon.r*0.28, moon.r*0.16, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }

    function drawStars() {
        stars.forEach(s => {
            s.twinkle += s.speed;
            const a = 0.35 + Math.sin(s.twinkle) * 0.45;
            ctx.fillStyle = `rgba(255,255,240,${Math.max(0.1, a)})`;
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
        });
    }

    function drawLanterns() {
        if (Math.random() < 0.009 && lanterns.length < 24) spawnLantern();
        lanterns = lanterns.filter(l => l.life < l.maxLife);
        lanterns.forEach(l => {
            l.x += l.vx + Math.sin(time*0.01 + l.x)*0.18;
            l.y += l.vy;
            l.life++;
            if (l.life < 50) l.opacity = (l.life/50) * l.maxOpacity;
            else if (l.life > l.maxLife - 80) l.opacity = ((l.maxLife - l.life)/80) * l.maxOpacity;
            else l.opacity = l.maxOpacity;

            ctx.save();
            const g2 = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.size * 2);
            g2.addColorStop(0, `rgba(255,185,50,${l.opacity * 0.4})`);
            g2.addColorStop(1, 'rgba(255,140,30,0)');
            ctx.fillStyle = g2;
            ctx.beginPath(); ctx.arc(l.x, l.y, l.size * 2, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = `rgba(255,205,80,${l.opacity})`;
            ctx.beginPath();
            ctx.ellipse(l.x, l.y, l.size * 0.6, l.size * 0.8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });
    }

    function drawFireflies() {
        fireflies.forEach(f => {
            f.phase += 0.035;
            f.x += f.vx + Math.sin(f.phase) * 0.35;
            f.y += f.vy + Math.cos(f.phase * 0.7) * 0.22;
            if (f.x < 0) f.x = W;
            if (f.x > W) f.x = 0;
            if (f.y < waterY - 220) f.vy = 0.2;
            if (f.y > waterY - 10) f.vy = -0.2;
            const a = 0.35 + Math.sin(f.phase * 2) * 0.35;
            const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 4);
            g.addColorStop(0, `rgba(210,255,110,${Math.max(0, a)})`);
            g.addColorStop(1, 'rgba(210,255,110,0)');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 4, 0, Math.PI * 2); ctx.fill();
        });
    }

    function drawTemple() {
        ctx.save();
        ctx.fillStyle = 'rgba(4, 2, 18, 0.95)';
        const tx = W * 0.12, ty = waterY;
        ctx.beginPath();
        ctx.moveTo(tx - 45, ty);
        ctx.lineTo(tx - 35, ty - 50);
        ctx.lineTo(tx - 20, ty - 85);
        ctx.lineTo(tx - 6, ty - 125);
        ctx.lineTo(tx, ty - 150);
        ctx.lineTo(tx + 6, ty - 125);
        ctx.lineTo(tx + 20, ty - 85);
        ctx.lineTo(tx + 35, ty - 50);
        ctx.lineTo(tx + 45, ty);
        ctx.fill();

        const tx2 = W * 0.88, ty2 = waterY;
        ctx.beginPath();
        ctx.moveTo(tx2 - 50, ty2);
        ctx.lineTo(tx2 - 38, ty2 - 60);
        ctx.lineTo(tx2 - 22, ty2 - 100);
        ctx.lineTo(tx2 - 8, ty2 - 135);
        ctx.lineTo(tx2, ty2 - 160);
        ctx.lineTo(tx2 + 8, ty2 - 135);
        ctx.lineTo(tx2 + 22, ty2 - 100);
        ctx.lineTo(tx2 + 38, ty2 - 60);
        ctx.lineTo(tx2 + 50, ty2);
        ctx.fill();

        for (let i = 0; i < 7; i++) {
            const treex = W * (0.02 + i * 0.16 + Math.sin(i*2.8)*0.02);
            const treetop = waterY - 32 - (i % 3) * 12;
            ctx.beginPath();
            ctx.ellipse(treex, treetop, 20, 36, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.fillRect(treex - 3, treetop + 20, 6, 22);
        }
        ctx.restore();
    }

    // ---- Water Surface ----
    function drawWater() {
        const wg = ctx.createLinearGradient(0, waterY, 0, H);
        wg.addColorStop(0, 'rgba(9, 50, 105, 0.9)');
        wg.addColorStop(0.3, 'rgba(5, 30, 75, 0.94)');
        wg.addColorStop(1, 'rgba(2, 12, 32, 0.98)');
        ctx.fillStyle = wg;
        ctx.fillRect(0, waterY, W, H - waterY);

        ctx.save();
        for (let i = 0; i < 9; i++) {
            const wy = waterY + i * ((H - waterY) / 9);
            const a = 0.045 - i * 0.0035;
            ctx.strokeStyle = `rgba(160, 215, 255, ${Math.max(a, 0.006)})`;
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            for (let x = 0; x < W; x += 4) {
                const y = wy + Math.sin(x * 0.007 + time * 0.025 + i) * 3.5
                             + Math.sin(x * 0.016 + time * 0.018) * 1.8;
                x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.stroke();
        }
        ctx.restore();

        ctx.save();
        const reflY = waterY + 15;
        for (let i = 0; i < 18; i++) {
            const ry = reflY + i * 7.5;
            const rx = moon.x + Math.sin(time * 0.025 + i * 0.45) * (6 + i * 1.8);
            const ra = 0.09 - i * 0.0045;
            ctx.fillStyle = `rgba(255, 250, 190, ${Math.max(ra, 0)})`;
            ctx.fillRect(rx - 16 + i * 0.8, ry, 32 - i * 1.4, 2);
        }
        ctx.restore();
    }

    // ---- Krathong Drawing & Wish Badges ----
    const krathongColors = [
        { petal: '#ff69b4', center: '#ffd700', leaf: '#228b22', candle: '#fff4c2' }, // lotus pink
        { petal: '#ff8fa3', center: '#ffe066', leaf: '#2d8b4e', candle: '#fff8dc' }, // sakura
        { petal: '#ff4444', center: '#ffcc00', leaf: '#1a7a3a', candle: '#fff4c2' }, // hibiscus
        { petal: '#66bb6a', center: '#a5d6a7', leaf: '#1b5e20', candle: '#fffde7' }, // leaf green
    ];

    function drawKrathong(k) {
        ctx.save();
        ctx.translate(k.x, k.y);

        const bobY = Math.sin(time * 0.035 + k.phase) * 3.2;
        const bobRot = Math.sin(time * 0.022 + k.phase + 1) * 0.035;
        ctx.translate(0, bobY);
        ctx.rotate(bobRot);

        const s = k.size;
        const col = krathongColors[k.type] || krathongColors[0];

        // Banana leaf base
        ctx.fillStyle = col.leaf;
        ctx.beginPath();
        ctx.ellipse(0, 0, s * 1.35, s * 0.48, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1; ctx.stroke();

        ctx.fillStyle = 'rgba(0,50,0,0.35)';
        ctx.beginPath();
        ctx.ellipse(0, 0, s * 0.95, s * 0.36, 0, 0, Math.PI * 2);
        ctx.fill();

        // Flower Petals
        const petalCount = k.type === 3 ? 6 : 8;
        for (let i = 0; i < petalCount; i++) {
            const angle = (i / petalCount) * Math.PI * 2 - Math.PI / 2;
            const px = Math.cos(angle) * s * 0.52;
            const py = Math.sin(angle) * s * 0.22;
            ctx.fillStyle = col.petal;
            ctx.beginPath();
            ctx.ellipse(px, py, s * 0.26, s * 0.11, angle, 0, Math.PI * 2);
            ctx.fill();
        }

        // Center pollen
        ctx.fillStyle = col.center;
        ctx.beginPath(); ctx.arc(0, -s * 0.02, s * 0.16, 0, Math.PI * 2); ctx.fill();

        // Candle
        ctx.fillStyle = '#fffbe6';
        ctx.fillRect(-2.5, -s * 0.52, 5, s * 0.38);

        // Candle Flame with dynamic flickering
        const flicker = Math.sin(time * 0.16 + k.phase) * 2;
        const flameH = s * 0.26 + Math.sin(time * 0.22 + k.phase) * 3.5;

        const fg = ctx.createRadialGradient(flicker, -s * 0.58, 0, flicker, -s * 0.58, s * 0.7);
        fg.addColorStop(0, 'rgba(255,200,50,0.4)');
        fg.addColorStop(1, 'rgba(255,200,50,0)');
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.arc(flicker, -s * 0.58, s * 0.7, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#ffdd44';
        ctx.beginPath();
        ctx.moveTo(-4.5 + flicker, -s * 0.52);
        ctx.quadraticCurveTo(-6.5 + flicker, -s * 0.52 - flameH * 0.5, flicker, -s * 0.52 - flameH);
        ctx.quadraticCurveTo(6.5 + flicker, -s * 0.52 - flameH * 0.5, 4.5 + flicker, -s * 0.52);
        ctx.fill();

        ctx.fillStyle = '#fff8e0';
        ctx.beginPath();
        ctx.moveTo(-2 + flicker, -s * 0.52);
        ctx.quadraticCurveTo(-3 + flicker, -s * 0.52 - flameH * 0.4, flicker, -s * 0.52 - flameH * 0.65);
        ctx.quadraticCurveTo(3 + flicker, -s * 0.52 - flameH * 0.4, 2 + flicker, -s * 0.52);
        ctx.fill();

        // Incense Sticks
        ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(-8, -s * 0.16); ctx.lineTo(-11, -s * 0.68); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(8, -s * 0.16); ctx.lineTo(11, -s * 0.68); ctx.stroke();
        ctx.fillStyle = '#ff5500';
        ctx.beginPath(); ctx.arc(-11, -s * 0.68, 2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(11, -s * 0.68, 2, 0, Math.PI * 2); ctx.fill();

        // Reflection on water
        ctx.globalAlpha = 0.16;
        ctx.scale(1, -0.42);
        ctx.fillStyle = col.candle;
        ctx.beginPath();
        ctx.ellipse(0, -s * 0.52, s * 0.65, s * 0.22, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        ctx.restore();

        // Wish Badge & Floating Time (Anonymous - No Name)
        if (showWishes && k.wish) {
            drawWishBadge(k, bobY);
        }
    }

    function drawWishBadge(k, bobY) {
        ctx.save();
        const badgeX = k.x;
        const badgeY = k.y + bobY - k.size * 0.95;

        let displayWish = k.wish;
        if (displayWish.length > 28) displayWish = displayWish.substring(0, 26) + '...';

        ctx.font = '500 12px "Kanit", sans-serif';
        const wishWidth = ctx.measureText(`"${displayWish}"`).width;
        
        ctx.font = '400 10px "Kanit", sans-serif';
        const timeText = `⏱️ ${k.timeStr || ''}`;
        const timeWidth = ctx.measureText(timeText).width;

        const boxW = Math.max(wishWidth, timeWidth) + 24;
        const boxH = 36;
        const rx = badgeX - boxW / 2;
        const ry = badgeY - boxH;

        ctx.fillStyle = 'rgba(8, 14, 40, 0.82)';
        ctx.strokeStyle = 'rgba(255, 215, 0, 0.45)';
        ctx.lineWidth = 1;

        ctx.beginPath();
        ctx.roundRect(rx, ry, boxW, boxH, 8);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = 'rgba(8, 14, 40, 0.82)';
        ctx.beginPath();
        ctx.moveTo(badgeX - 5, ry + boxH);
        ctx.lineTo(badgeX + 5, ry + boxH);
        ctx.lineTo(badgeX, ry + boxH + 5);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#fff9e6';
        ctx.font = '500 12px "Kanit", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(`"${displayWish}"`, badgeX, ry + 6);

        ctx.fillStyle = '#ffd700';
        ctx.font = '400 10px "Kanit", sans-serif';
        ctx.fillText(timeText, badgeX, ry + 21);

        ctx.restore();
    }

    // ---- Ripples & Sparkles ----
    function drawRipples() {
        ripples = ripples.filter(r => r.life < r.maxLife);
        ripples.forEach(r => {
            r.life++;
            r.radius += 1.3;
            const a = Math.max(0, 1 - r.life / r.maxLife);
            ctx.strokeStyle = `rgba(180, 225, 255, ${a * 0.32})`;
            ctx.lineWidth = 1.1;
            ctx.beginPath();
            ctx.ellipse(r.x, r.y, r.radius, r.radius * 0.32, 0, 0, Math.PI * 2);
            ctx.stroke();
        });
    }

    function drawSparkles() {
        sparkles = sparkles.filter(s => s.life < s.maxLife);
        sparkles.forEach(s => {
            s.life++;
            s.x += s.vx;
            s.y += s.vy;
            s.vy -= 0.012;
            const a = Math.max(0, 1 - s.life / s.maxLife);
            ctx.fillStyle = `rgba(255, 235, 110, ${a})`;
            const sr = Math.max(0, s.r * a);
            ctx.beginPath(); ctx.arc(s.x, s.y, sr, 0, Math.PI * 2); ctx.fill();
        });
    }

    function spawnSparkles(x, y) {
        for (let i = 0; i < 18; i++) {
            sparkles.push({
                x, y,
                vx: (Math.random() - 0.5) * 3.5,
                vy: -Math.random() * 2.5 - 0.6,
                r: Math.random() * 3 + 1.2,
                life: 0,
                maxLife: 45 + Math.random() * 35
            });
        }
    }

    // ---- Core Action: Add, Float & Persist Krathong ----
    function addKrathong(x, y, wish) {
        const timeStr = getNowTimeString();
        const now = Date.now();
        const finalWish = (wish && wish.trim().length > 0) ? wish.trim() : 'ขอให้มีความสุข สมปรารถนาทุกประการ';
        const finalX = Math.max(40, Math.min(W - 40, x));
        const finalY = Math.max(y, waterY + 15);

        const dataItem = {
            id: 'k_' + now + '_' + Math.floor(Math.random() * 10000),
            wish: finalWish,
            timeStr: timeStr,
            timestamp: now,
            type: selectedType,
            xRatio: finalX / W,
            yOffset: finalY - waterY
        };

        // Persist data into local storage & memory
        persistNewKrathong(dataItem);
        instantiateKrathongFromData(dataItem);

        // Ripples & sparkles
        for (let i = 0; i < 3; i++) {
            ripples.push({ x: finalX, y: finalY, radius: 6 + i * 6, life: 0, maxLife: 70 + i * 25 });
        }
        spawnSparkles(finalX, finalY - 20);
        playSplashSound();

        // Clear input after launching
        document.getElementById('wish-input').value = '';
    }

    function updateKrathongs() {
        krathongs.forEach(k => {
            k.x += k.vx + Math.sin(time * 0.006 + k.phase) * 0.16;
            k.y += Math.sin(time * 0.012 + k.phase) * 0.1;
            if (k.opacity < 1) k.opacity = Math.min(1, k.opacity + 0.025);
            k.vx *= 0.9992;
            k.x += k.driftSpeed * Math.sin(time * 0.0035 + k.phase);

            if (k.x < -60) k.x = W + 60;
            if (k.x > W + 60) k.x = -60;
        });
    }

    // ---- Slide & Drag Krathong to River Mechanic ----
    const launcher = document.getElementById('drag-launcher');
    const dragAvatar = document.getElementById('drag-avatar');
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    function onDragStart(e) {
        isDragging = true;
        const pageX = e.touches ? e.touches[0].clientX : e.clientX;
        const pageY = e.touches ? e.touches[0].clientY : e.clientY;
        dragStartX = pageX;
        dragStartY = pageY;

        dragAvatar.style.display = 'block';
        dragAvatar.style.left = `${pageX}px`;
        dragAvatar.style.top = `${pageY}px`;
        dragAvatar.textContent = typeIcons[selectedType];
    }

    function onDragMove(e) {
        if (!isDragging) return;
        const pageX = e.touches ? e.touches[0].clientX : e.clientX;
        const pageY = e.touches ? e.touches[0].clientY : e.clientY;

        dragAvatar.style.left = `${pageX}px`;
        dragAvatar.style.top = `${pageY}px`;

        if (pageY >= waterY && Math.random() < 0.25) {
            ripples.push({ x: pageX, y: pageY, radius: 4, life: 0, maxLife: 30 });
        }
    }

    function onDragEnd(e) {
        if (!isDragging) return;
        isDragging = false;
        dragAvatar.style.display = 'none';

        const pageX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
        const pageY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;

        if (pageY <= H * 0.85 && pageY >= waterY - 30) {
            const userWish = document.getElementById('wish-input').value;
            addKrathong(pageX, Math.max(pageY, waterY + 20), userWish);
        } else if (pageY < dragStartY - 60) {
            const userWish = document.getElementById('wish-input').value;
            addKrathong(pageX, waterY + 40 + Math.random() * 80, userWish);
        }
    }

    launcher.addEventListener('mousedown', onDragStart);
    launcher.addEventListener('touchstart', onDragStart, { passive: false });

    window.addEventListener('mousemove', onDragMove);
    window.addEventListener('touchmove', onDragMove, { passive: false });

    window.addEventListener('mouseup', onDragEnd);
    window.addEventListener('touchend', onDragEnd);

    // Enter in wish input
    document.getElementById('wish-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            const text = e.target.value;
            const rx = W * 0.3 + Math.random() * (W * 0.4);
            const ry = waterY + 30 + Math.random() * (H * 0.25);
            addKrathong(rx, ry, text);
        }
    });

    // Canvas click
    canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;

        for (let i = krathongs.length - 1; i >= 0; i--) {
            const k = krathongs[i];
            const dist = Math.hypot(clickX - k.x, clickY - k.y);
            if (dist < k.size * 1.5) {
                document.getElementById('modal-wish-content').textContent = `"${k.wish}"`;
                document.getElementById('modal-meta-content').textContent = `⏱️ ลอยเมื่อเวลา ${getFullDateString(k.timestamp)} | นิรนาม`;
                document.getElementById('detail-modal').classList.add('show');
                playSplashSound();
                return;
            }
        }

        if (clickY >= waterY - 10 && clickY <= H * 0.88) {
            const userWish = document.getElementById('wish-input').value;
            addKrathong(clickX, clickY, userWish);
        }
    });

    document.getElementById('modal-close').addEventListener('click', () => {
        document.getElementById('detail-modal').classList.remove('show');
    });

    // ---- Main Render Loop ----
    function render() {
        time++;
        ctx.clearRect(0, 0, W, H);

        drawStars();
        drawMoon();
        drawTemple();
        drawFireflies();
        drawLanterns();

        drawWater();
        drawRipples();

        updateKrathongs();
        krathongs.forEach(k => {
            ctx.globalAlpha = k.opacity;
            drawKrathong(k);
            ctx.globalAlpha = 1;
        });

        drawSparkles();

        requestAnimationFrame(render);
    }
    render();

    // Initial load from storage
    loadPersistedData();

    </script>
</body>
</html>
